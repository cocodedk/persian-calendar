name: Release APK

# Manual, tag-based releases (same pattern as the chess-puzzles project).
# The GitHub Release creates the tag at the current commit, so nothing is ever
# pushed to the protected main branch. gradle.properties is the version source of
# truth; build.gradle reads VERSION_NAME/VERSION_CODE from it.
on:
  workflow_dispatch:

permissions:
  contents: write

# Serialize rather than cancel: two concurrent runs would read the same version from
# gradle.properties and both try to release it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Require all four signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing signing secret(s):$missing — set the ANDROID_* repo secrets."
            exit 1
          fi

      - name: Read the version
        id: version
        run: |
          # gradle.properties is the only place the version is set; F-Droid's checkupdates
          # reads the same lines at each tag. Refuse to re-release a version, so a
          # forgotten bump fails here instead of overwriting nothing and confusing later.
          VERSION=$(sed -n 's/^VERSION_NAME=//p' gradle.properties)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Cannot parse VERSION_NAME: '$VERSION'"; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::v$VERSION is already released. Bump VERSION_NAME and VERSION_CODE in gradle.properties first."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Stage the signed APK under a stable filename
        run: |
          if ls app/build/outputs/apk/release/*-unsigned.apk >/dev/null 2>&1; then
            echo "::error::Release APK came out unsigned — signing config did not apply."; exit 1
          fi
          src=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          [ -n "$src" ] || { echo "::error::No release APK produced."; exit 1; }
          cp "$src" persian-calendar.apk

      - name: Create GitHub Release (creates the tag at this commit)
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          # Pin the tag to the commit that was built; otherwise it lands on whatever main
          # points at when the API call runs, and F-Droid would rebuild the wrong commit.
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: persian-calendar.apk
